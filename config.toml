# Strategy settings. Save your changes; they apply on the next run.

[account]
account_size = 10000        # total account size in USD
cash_reserve_pct = 0.20     # always keep 20% in cash, for assignments and repairs
max_ticker_pct = 0.50       # one ticker (put collateral + share value) may use at most 50% of the account
fee_per_contract = 0.65     # cost per contract per side (commission + regulatory fees); check your broker's schedule
risk_free_rate = 0.04

[rules]
dte_min = 25                # days-to-expiry range
dte_max = 45
delta_min = 0.15            # |delta| range, roughly the chance of assignment
delta_max = 0.30
min_open_interest = 100     # contracts with little open interest fill badly
max_spread_pct = 0.15       # maximum (ask - bid) / mid
avoid_earnings = true       # skip contracts that expire after an earnings report
calls_above_cost_basis = true  # covered-call strikes no lower than the share cost
take_profit = 0.50          # alert to close once 50% of the premium is captured
roll_dte = 21               # alert when 21 days remain and the target is not reached
loss_multiple = 2.0         # alert to stop out when the loss reaches 2x the premium
near_strike_pct = 0.02      # alert when the price is within 2% of the strike
target_delta = 0.20         # per ticker, list only the contract with |delta| closest to this
target_dte = 35             # prefer the expiry nearest this many days
max_expiries = 2            # expiries to look at per ticker

[spreads]
# When 100 shares cost too much, use a put credit spread: sell one put and buy a lower-strike put.
max_loss_per_spread = 500   # maximum loss per spread in USD = (strike difference - net credit) x 100 + fees
min_credit_pct = 0.20       # net credit must be at least 20% of the strike difference
min_natural_credit_pct = 0.50  # at the worst fill (sell at bid, buy at ask) at least half the mid credit must remain

[universe]
universe_mode = "top100"    # "top100" = largest US-listed companies by market cap (auto-refreshed); "watchlist" = only the tickers below
top_n = 100
universe_refresh_days = 7   # refresh the market-cap ranking every 7 days
btc_tickers = ["IBIT"]      # BTC exposure: BlackRock's spot bitcoin ETF, the most liquid options

[watchlist]
# used only when universe_mode = "watchlist"
tickers = ["BAC", "VZ", "T", "PFE", "KMI", "KDP", "CMCSA", "VICI", "SOFI", "NU", "CMG", "MNST", "XLF", "XLU", "FXI", "SLV"]
